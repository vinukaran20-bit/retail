<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Your App</title>
  <!-- Google Fonts + Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* --- base reset (would typically live in base.html) --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      line-height: 1.5;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }

    /* --- login card styling --- */
    .card.login {
      max-width: 440px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 30px 50px -20px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.8),
        0 0 40px rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: cardFloat 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardFloat {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card.login:hover {
      box-shadow: 
        0 35px 60px -15px rgba(0, 0, 0, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.9),
        0 0 60px rgba(37, 99, 235, 0.15);
    }

    .card.login h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.8rem;
      text-align: center;
      background: linear-gradient(135deg, #1e293b, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    /* form labels & inputs */
    .card.login label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #334155;
      letter-spacing: 0.01em;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group i {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
      transition: color 0.2s;
      pointer-events: none;
    }

    .card.login input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 1.2rem;
      outline: none;
      transition: all 0.2s ease;
      color: #0f172a;
    }

    .card.login input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .card.login input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .card.login input:focus + i {
      color: #2563eb;
    }

    /* password toggle */
    .password-toggle {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem;
      transition: color 0.2s;
      z-index: 2;
    }

    .password-toggle:hover {
      color: #475569;
    }

    /* form extras */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.5rem 0 1.8rem;
      font-size: 0.9rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #475569;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      border-radius: 6px;
      cursor: pointer;
    }

    .forgot-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #1e4ec9;
      text-decoration: underline;
    }

    /* button */
    .btn {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: white;
      background: linear-gradient(135deg, #2563eb, #1e4ec9);
      border: none;
      border-radius: 1.2rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px -8px rgba(37, 99, 235, 0.4);
      letter-spacing: 0.01em;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: linear-gradient(135deg, #1e4ec9, #1e3a8a);
      box-shadow: 0 15px 25px -8px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 5px 12px -5px rgba(37, 99, 235, 0.5);
    }

    /* signup hint */
    .signup-hint {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    .signup-hint a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-hint a:hover {
      text-decoration: underline;
    }

    /* footer (optional, for demo) */
    .page-footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }

    /* responsive */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .card.login {
        padding: 2rem 1.5rem;
        border-radius: 1.5rem;
      }

      .card.login h1 {
        font-size: 1.7rem;
        margin-bottom: 1.5rem;
      }

      .card.login input {
        padding: 0.8rem 0.8rem 0.8rem 2.8rem;
        font-size: 0.95rem;
      }

      .input-group i {
        left: 1rem;
        font-size: 0.9rem;
      }

      .password-toggle {
        right: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- 
    This is the content block that would go inside base.html.
    In your template, you would replace the existing card with the improved version below.
  -->
  <div class="card login">
    <h1>Sign in</h1>
    <form method="post">
      <!-- username field with icon -->
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Username" required autofocus>
      </div>

      <!-- password field with icon and visibility toggle -->
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <!-- extras: remember me & forgot password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- submit button -->
      <button class="btn" type="submit">
        <i class="fas fa-arrow-right-to-bracket" style="margin-right: 0.5rem;"></i> Login
      </button>
    </form>

    <!-- signup hint (optional) -->
    <p class="signup-hint">
      Don't have an account? <a href="#">Sign up</a>
    </p>
  </div>

  <!-- small footer for demo -->
  <div class="page-footer">
    <i class="fas fa-shield-alt" style="margin-right: 0.4rem;"></i> Secure login · YourApp
  </div>

  <!-- password toggle script -->
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.querySelector('i').classList.toggle('fa-eye');
      this.querySelector('i').classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
